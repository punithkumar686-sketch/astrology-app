<!DOCTYPE html>
<html>
<head>
    <title>Astrology SaaS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #fff6e6;
        }

        .nav {
            background: #ff9933;
            padding: 15px;
            display: flex;
            justify-content: space-around;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .box {
            background: white;
            border: 2px solid #ff9933;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
    </style>
</head>

<body>

<div class="nav">
    <a href="/">Home</a>
    <a href="/chart">Kundli</a>
    <a href="/match">Match</a>
    <a href="/dasha">Dasha</a>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
