{% extends "base.html" %}

{% block content %}

<h2>🏠 12 House Kundli (Real Vedic System)</h2>

<div class="grid">

    {% for house, planets in kundli.items() %}
    <div class="box">
        <b>{{ house }}</b><br><br>

        {% if planets %}
            {% for p in planets %}
                • {{ p }}<br>
            {% endfor %}
        {% else %}
            Empty
        {% endif %}

    </div>
    {% endfor %}

</div>

{% endblock %}
