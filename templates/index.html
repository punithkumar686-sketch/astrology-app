<!DOCTYPE html>
<html>
<head>
    <title>Jyotish Reading</title>
    <link rel="stylesheet" href="/static/style.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">

    <!-- Calendar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>

<div class="container">

    <h1>🔮 Astrology Reading</h1>

    <form method="POST">

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="text" id="dob" name="dob" placeholder="Date of Birth" required>

        <input type="text" id="time" name="time" placeholder="Time" required>

        <input type="text" name="place" placeholder="Place of Birth" required>

        <button type="submit">Generate Report</button>
    </form>

    <div class="result">
        <pre>{{ prediction }}</pre>
    </div>

    <a href="/download">
        <button class="download">Download PDF</button>
    </a>

    <!-- Payment -->
    <button id="pay-btn">Pay ₹99</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
flatpickr("#dob", {dateFormat: "d/m/Y"});
flatpickr("#time", {enableTime: true, noCalendar: true, dateFormat: "H:i"});
</script>

<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
document.getElementById('pay-btn').onclick = function () {
    var options = {
        "key": "YOUR_RAZORPAY_KEY",
        "amount": "9900",
        "currency": "INR",
        "name": "Astrology Report",
        "description": "5-Year Prediction",
        "handler": function () {
            alert("Payment Successful!");
        }
    };
    var rzp = new Razorpay(options);
    rzp.open();
}
</script>

</body>
</html>
