<!DOCTYPE html>
<html>
<head>
    <title>Jyotish AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="navbar">
    <h2>Jyotish AI</h2>
    <a href="/">Home</a>
</div>

<div class="hero">
    <h1>Your Destiny, Written in the Stars</h1>

    <form method="POST">
        <input name="name" placeholder="Full Name" required>
        <input type="date" name="dob" required>
        <input type="time" name="time" required>
        <input name="place" placeholder="Birth Place" required>

        <button type="submit">Generate Kundli</button>
    </form>
</div>

{% if data %}
<div class="result">
    <h2>{{ data.name }}'s Kundli</h2>

    {% for planet in data.kundli %}
        <div class="card">
            <h3>{{ planet.name }}</h3>
            <p>Sign: {{ planet.sign }}</p>
            <p>Degree: {{ planet.normDegree }}</p>
        </div>
    {% endfor %}
</div>
{% endif %}

</body>
</html>
