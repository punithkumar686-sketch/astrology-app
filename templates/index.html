<!DOCTYPE html>
<html>
<head>
    <title>Astrology App</title>
</head>
<body style="background:black;color:white;font-family:sans-serif">

<h1>🔮 Astrology App</h1>

<form method="POST">
    <input name="name" placeholder="Name" required><br><br>
    <input type="date" name="dob" required><br><br>
    <input type="time" name="time" required><br><br>
    <input name="place" placeholder="Place (e.g. Bangalore)" required><br><br>

    <button type="submit">Generate Kundli</button>
</form>

{% if kundli_data %}
    <h2>{{ kundli_data.name }}'s Kundli</h2>

    {% for p in kundli_data.planets %}
        <div style="border:1px solid white;padding:10px;margin:10px">
            <h3>{{ p.name }}</h3>
            <p>Sign: {{ p.sign }}</p>
            <p>Degree: {{ p.normDegree }}</p>
        </div>
    {% endfor %}
{% endif %}

</body>
</html>
