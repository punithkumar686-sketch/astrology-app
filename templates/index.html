<!DOCTYPE html>
<html>
<head>
    <title>Jyotish</title>
    <link rel="stylesheet" href="/static/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">
</head>

<body>

<div class="navbar">
    <div class="logo">Jyotish</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/">New Reading</a>
    </div>
</div>

<div class="hero">
    <h1>
        A five-year reading,<br>
        drawn from the stars<br>
        you were born under.
    </h1>

    <p>Enter your birth details below</p>

    <form method="POST">

        <input name="name" placeholder="Full Name" required>
        <input type="date" name="dob">
        <input name="time" placeholder="HH:MM (24hr)" required>
        <input name="place" placeholder="Place" required>

        <button type="submit">Begin Reading</button>
    </form>

    {% if sun_sign %}
    <div class="signs">
        ☀ Sun Sign: {{ sun_sign }} <br>
        🌙 Moon Sign: {{ moon_sign }}
    </div>
    {% endif %}

    <div class="result">
        <pre>{{ prediction }}</pre>
    </div>

</div>

</body>
</html>
