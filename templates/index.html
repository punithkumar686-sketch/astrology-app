<!DOCTYPE html>
<html>
<head>
    <title>Jyotish Reading</title>
    <link rel="stylesheet" href="/static/style.css">

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter&display=swap" rel="stylesheet">

    <!-- Flatpickr (Date + Time Picker) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>

<div class="navbar">
    <div class="logo">Jyotish</div>
    <button class="cta">Begin Reading</button>
</div>

<div class="container">

    <h2 class="subtitle">ज्योतिष</h2>

    <h1>
        A five-year reading,<br>
        drawn from the stars<br>
        you were born under.
    </h1>

    <p class="desc">
        Enter your birth details for a personalized forecast on career, wealth and marriage.
    </p>

    <form method="POST" class="form">

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="text" id="dob" name="dob" placeholder="Select Date of Birth" required>

        <input type="text" id="time" name="time" placeholder="Select Time" required>

        <input type="text" id="place" name="place" placeholder="Enter Birth Place" required>

        <button type="submit">Generate Reading</button>
    </form>

    <div class="result">
        <pre>{{ prediction }}</pre>
    </div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    flatpickr("#dob", {
        dateFormat: "d/m/Y"
    });

    flatpickr("#time", {
        enableTime: true,
        noCalendar: true,
        dateFormat: "H:i"
    });
</script>

    <script>
function initAutocomplete() {
    const input = document.getElementById("place");
    new google.maps.places.Autocomplete(input);
}
google.maps.event.addDomListener(window, 'load', initAutocomplete);
</script>

</body>
</html>
